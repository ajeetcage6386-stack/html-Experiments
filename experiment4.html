<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel room booking Form</title>
</head>
<body>
    <h1 align="center"> Hotel room Booking Form</h1>
    <hr><br>
    <form action="#"align="center">
    <label for="Full Name">Full Name :</label>
    <input type="text"name="Full Name" id="full">
    <br><br>
    <label for="email">Email:</label>
    <input type="email">
    <br><br>

    <label for="phone">phone :</label>
    <input type="tel" name="phone"id="phpone">
    <br><br>

    <label for="check In">Check IN:</label>
    <input type="date" name="Check IN" Id="Check IN">
    <BR><BR>
        <label for="check OUT">Check OUT:</label>
    <input type="date" name="Check OUT" Id="Check OUT"> 
    <BR><BR>
        <label for="Room">Room Type:</label>
        <select name="Room" id="Room">
            <option value="Single">Single</option>"
             <option value="double">double</option>"
              <option value="tripple">tripple</option>"
        </select>
        <br><br>
        <label for="Guest">No of Guest:</label>
         <input type="number" name="number of Guests" id="number of Guests">
        <br><br>
<label for="Special Request">Special Request</label>
,<textarea name="Special Request" id="">Special request</textarea>
<br><br>

        <button type="submit">Book now</button>
         <button type="reset">reset now</button>
    </form>
    <br><br>
    <footer align="center">
        &copy;2026 Hotel Room Booking Form
    </footer>
</body>
</html>
